name: C5G7 high-budget six-layout validation screen

on:
  push:
    branches:
      - research/c5g7-high-budget-layout-validation-20261015
    paths:
      - .github/workflows/c5g7-high-budget-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  high-budget-case:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate:
          - id: c5g7-2x2-MMUU
            signature: MMUU
          - id: c5g7-2x2-MUMU
            signature: MUMU
          - id: c5g7-2x2-MUUM
            signature: MUUM
          - id: c5g7-2x2-UMMU
            signature: UMMU
          - id: c5g7-2x2-UMUM
            signature: UMUM
          - id: c5g7-2x2-UUMM
            signature: UUMM
        seed_base: [20261015, 20262015, 20263015]
    env:
      UCX_TLS: self,tcp
      BATCHES: "20000"
      INACTIVE: "500"
      PARTICLES: "10000"
      THREADS: "1"
    steps:
      - name: Checkout CB-PFR campaign protocol
        uses: actions/checkout@v4
      - name: Install pinned OpenMC 0.16.0
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: c5g7-high-budget
          create-args: python=3.12 openmc=0.16.0
          cache-environment: true
      - name: Prepare and pin upstream C5G7 model source
        shell: bash -el {0}
        run: |
          python scripts/prepare_c5g7_reference.py --destination /tmp/mit-crpg-benchmarks
          git -C /tmp/mit-crpg-benchmarks rev-parse HEAD
      - name: Run one high-budget layout replicate
        shell: bash -el {0}
        env:
          CANDIDATE_ID: ${{ matrix.candidate.id }}
          EXPECTED_SIGNATURE: ${{ matrix.candidate.signature }}
          SEED_BASE: ${{ matrix.seed_base }}
        run: |
          set -euo pipefail
          ROUND="$GITHUB_WORKSPACE/high-budget-results/$CANDIDATE_ID/seed_$SEED_BASE"
          mkdir -p "$(dirname "$ROUND")"
          python scripts/run_c5g7_layout_study.py \
            --source-root /tmp/mit-crpg-benchmarks \
            --design-space config/benchmarks/c5g7_2x2_design_space.json \
            --output "$ROUND" --mode run \
            --batches "$BATCHES" --inactive "$INACTIVE" \
            --particles "$PARTICLES" --threads "$THREADS" \
            --seed-base "$SEED_BASE" --candidate-ids "$CANDIDATE_ID"
      - name: Audit raw HDF5 statepoint
        shell: bash -el {0}
        env:
          CANDIDATE_ID: ${{ matrix.candidate.id }}
          SEED_BASE: ${{ matrix.seed_base }}
        run: |
          set -euo pipefail
          ROUND="$GITHUB_WORKSPACE/high-budget-results/$CANDIDATE_ID/seed_$SEED_BASE"
          mkdir -p "$ROUND/analysis"
          python scripts/audit_c5g7_smoke_statepoints.py \
            --study-summary "$ROUND/STUDY_SUMMARY.json" \
            --out "$ROUND/analysis/raw_hdf5_audit.json" \
            --expected-candidates 1
          STATEPOINT_REL="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["physical_results"]["statepoint"])' "$ROUND/$CANDIDATE_ID/CASE_RESULT.json")"
          STATEPOINT="$ROUND/$CANDIDATE_ID/$STATEPOINT_REL"
          python scripts/audit_c5g7_source_convergence.py \
            --statepoint "$STATEPOINT" \
            --out-json "$ROUND/analysis/source_convergence.json" \
            --out-csv "$ROUND/analysis/source_convergence.csv"
          python scripts/analyze_c5g7_assembly_fission.py \
            --statepoint "$STATEPOINT" \
            --candidate-id "$CANDIDATE_ID" \
            --layout-signature ${{ matrix.candidate.signature }} \
            --out "$ROUND/analysis/assembly_fission.json"
      - name: Verify high-budget run, seed, mesh, group structure, and tally
        shell: bash -el {0}
        env:
          CANDIDATE_ID: ${{ matrix.candidate.id }}
          EXPECTED_SIGNATURE: ${{ matrix.candidate.signature }}
          SEED_BASE: ${{ matrix.seed_base }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ["GITHUB_WORKSPACE"]) / "high-budget-results" / os.environ["CANDIDATE_ID"] / f"seed_{os.environ['SEED_BASE']}"
          study = json.loads((root / "STUDY_SUMMARY.json").read_text())
          assert study["status"] == "all_runs_completed_needs_independent_validation", study["status"]
          assert study["upstream_commit"] == "ba41bee54320ada0b4ac39a0dd2ca3c1d090a450", study["upstream_commit"]
          assert tuple(study["settings"][k] for k in ("batches","inactive","particles","threads")) == (20000,500,10000,1), study["settings"]
          cases = study["cases"]
          assert len(cases) == 1 and cases[0]["candidate_id"] == os.environ["CANDIDATE_ID"], cases
          case = cases[0]
          pos = ("p00","p01","p10","p11")
          signature = "".join("M" if case["layout"][p] == "MOX" else "U" for p in pos)
          assert signature == os.environ["EXPECTED_SIGNATURE"], signature
          case_dir = root / case["candidate_id"]
          settings_path = case_dir / "model" / "2d" / "settings.xml"
          settings = ET.parse(settings_path).getroot()
          seed = int(settings.findtext("seed"))
          assert seed == int(case["seed"]), (seed,case["seed"])
          assert (int(settings.findtext("batches")), int(settings.findtext("inactive")), int(settings.findtext("particles"))) == (20000,500,10000)
          mesh = settings.find("mesh")
          dimension = [int(x) for x in mesh.findtext("dimension").split()]
          lower = [float(x) for x in mesh.findtext("lower_left").split()]
          upper = [float(x) for x in mesh.findtext("upper_right").split()]
          assert dimension == [51,51], dimension
          assert lower[0] <= -32.13 and lower[1] <= -32.13, lower
          assert upper[0] >= 32.13 and upper[1] >= 32.13, upper
          physical = case["physical_results"]
          group_edges = [float(x) for x in physical["mgxs_energy_group_boundaries"]]
          expected_edges = [1e-5,0.0635,10.0,100.0,1000.0,500000.0,1000000.0,20000000.0]
          assert physical["mgxs_group_structure_audit"] == "PASS", physical["mgxs_group_structure_audit"]
          assert len(group_edges) == len(expected_edges) and all(abs(a-b) <= max(1e-12,abs(b)*1e-12) for a,b in zip(group_edges,expected_edges)), group_edges
          statepoint_rel = physical["statepoint"]
          statepoint = case_dir / statepoint_rel
          assert statepoint.is_file() and statepoint.stat().st_size > 0, statepoint
          log_path = case_dir / "model" / "2d" / "openmc.log"
          log = log_path.read_text(errors="replace")
          warnings = log.count("Fission source site(s) outside of entropy box")
          assert warnings == 0, f"entropy-mesh warnings={warnings}"
          raw_audit = json.loads((root / "analysis" / "raw_hdf5_audit.json").read_text())
          assert raw_audit["status"] == "PASS" and raw_audit["candidate_count"] == 1, raw_audit
          source = json.loads((root / "analysis" / "source_convergence.json").read_text())
          assert source["status"] == "DIAGNOSTIC_REVIEW_REQUIRED" and source.get("entropy"), source
          fission = json.loads((root / "analysis" / "assembly_fission.json").read_text())
          assert fission["candidate_id"] == case["candidate_id"] and fission["layout_signature"] == signature
          audit = {
              "candidate_id": case["candidate_id"], "layout_signature": signature,
              "seed": seed, "seed_base": int(os.environ["SEED_BASE"]),
              "settings_profile": study["settings"], "settings_profile_pass": True,
              "upstream_commit": study["upstream_commit"], "openmc_version": physical["openmc_version"],
              "mesh_dimension": dimension, "mesh_lower_left": lower, "mesh_upper_right": upper,
              "mgxs_energy_group_boundaries_eV": group_edges, "mgxs_group_structure_audit": physical["mgxs_group_structure_audit"],
              "keff_mean": physical["keff_mean"], "keff_std_dev": physical["keff_std_dev"],
              "statepoint_path": statepoint_rel,
              "statepoint_sha256": hashlib.sha256(statepoint.read_bytes()).hexdigest(),
              "mgxs_sha256": physical["mgxs_sha256_after_transport"],
              "warning_count": warnings, "raw_hdf5_audit": raw_audit["status"],
              "source_diagnostics_preserved": bool(source.get("entropy")),
              "fission_rate_peaking_factor": fission["fission_rate_peaking_factor"],
              "official_benchmark_acceptance": False,
              "convergence_certified": False
          }
          (root / "analysis" / "high_budget_run_audit.json").write_text(json.dumps(audit,indent=2)+"\n")
          print(json.dumps(audit,indent=2))
          PY
      - name: Preserve full statepoint and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5g7-high-budget-${{ matrix.candidate.id }}-seedbase-${{ matrix.seed_base }}
          path: high-budget-results/${{ matrix.candidate.id }}/seed_${{ matrix.seed_base }}/
          if-no-files-found: warn
          retention-days: 30

  aggregate-high-budget-campaign:
    if: always()
    needs: high-budget-case
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download available high-budget run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: c5g7-high-budget-*
          path: /tmp/c5g7-high-budget-artifacts
          merge-multiple: false
      - name: Checkout analysis scripts and frozen protocol
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate all available completed runs
        id: aggregate
        continue-on-error: true
        run: |
          python scripts/analyze_c5g7_high_budget_campaign.py \
            --artifacts-root /tmp/c5g7-high-budget-artifacts \
            --protocol config/benchmarks/c5g7_high_budget_six_layout_protocol_2026-10-15.json \
            --outdir /tmp/c5g7-high-budget-summary
      - name: Preserve campaign-level report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5g7-high-budget-campaign-summary
          path: /tmp/c5g7-high-budget-summary/
          if-no-files-found: warn
          retention-days: 30
      - name: Mark incomplete campaign as non-passing
        if: always()
        run: |
          if [ "${{ needs.high-budget-case.result }}" != "success" ] || [ "${{ steps.aggregate.outcome }}" != "success" ]; then
            echo "Campaign is incomplete or failed a data-integrity audit; no benchmark-validation claim."
            exit 1
          fi
          echo "Campaign run and integrity aggregation finished; official benchmark acceptance remains separately blocked."

name: C5G7 layout preparation audit

on:
  workflow_dispatch:

jobs:
  prepare-layouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMC Python API
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: c5g7-prepare
          create-args: >-
            python=3.12
            openmc=0.16.0
          cache-environment: true

      - name: Stage upstream C5G7 source and record revision
        shell: bash -el {0}
        run: |
          python scripts/prepare_c5g7_reference.py --destination /tmp/mit-crpg-benchmarks
          python - <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(Path("config/benchmarks/c5g7_2x2_design_space.json").read_text())
          provenance = json.loads(Path("/tmp/mit-crpg-benchmarks/UPSTREAM_PROVENANCE.json").read_text())
          expected_commit = expected["source_model"]["expected_upstream_commit"]
          actual_commit = provenance["source_commit"]
          print(f"expected upstream commit: {expected_commit}")
          print(f"actual upstream commit:   {actual_commit}")
          if actual_commit != expected_commit:
              raise SystemExit("upstream source changed; review and update the pinned design-space provenance explicitly")
          PY

      - name: Enumerate six assembly-placement layouts
        shell: bash -el {0}
        run: |
          python scripts/enumerate_c5g7_layouts.py --output /tmp/c5g7-design-space-generated.json
          python - <<'PY'
          import json
          from pathlib import Path

          generated = json.loads(Path("/tmp/c5g7-design-space-generated.json").read_text())
          frozen = json.loads(Path("config/benchmarks/c5g7_2x2_design_space.json").read_text())
          fields = ("candidate_id", "fuel_assembly_layout", "is_canonical_reference_arrangement")
          def project(data):
              return sorted([{key: row[key] for key in fields} for row in data["candidate_layouts"]], key=lambda row: row["candidate_id"])
          if generated["candidate_count"] != frozen["candidate_count"] or project(generated) != project(frozen):
              raise SystemExit("generated six-layout enumeration differs from the frozen design-space manifest")
          print("Generated candidate enumeration matches the frozen six-layout design space.")
          PY

      - name: Prepare six isolated model input cases (no transport run)
        shell: bash -el {0}
        run: |
          python scripts/run_c5g7_layout_study.py \
            --source-root /tmp/mit-crpg-benchmarks \
            --design-space config/benchmarks/c5g7_2x2_design_space.json \
            --output /tmp/c5g7-layout-study-prepared \
            --mode prepare
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/c5g7-layout-study-prepared")
          summary_path = root / "STUDY_SUMMARY.json"
          if not summary_path.is_file():
              raise SystemExit("prepared study did not write STUDY_SUMMARY.json")
          summary = json.loads(summary_path.read_text())
          print(json.dumps(summary, indent=2))
          PY

      - name: Build and audit XML inputs for all six cases (no transport run)
        shell: bash -el {0}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path("/tmp/c5g7-layout-study-prepared")
          summary = json.loads((root / "STUDY_SUMMARY.json").read_text())
          if len(summary.get("cases", [])) != 6:
              raise SystemExit("expected six prepared cases")
          audits = []
          for case in summary["cases"]:
              candidate_id = case["candidate_id"]
              case_root = root / candidate_id
              builder = case_root / "model/2d/build-xml-2d.py"
              if not builder.is_file():
                  raise SystemExit(f"{candidate_id}: missing 2-D model builder")
              source = builder.read_text()
              match = re.search(r"lattices\['Core'\]\.universes\s*=\s*(\[\[.*?\]\])", source, re.S)
              if not match:
                  raise SystemExit(f"{candidate_id}: expected core-lattice assignment not found")
              symbol = {"UO2": "u", "MOX": "m"}
              layout = case["layout"]
              expected = (
                  f"[[{symbol[layout['p00']]},{symbol[layout['p01']]},w],"
                  f"[{symbol[layout['p10']]},{symbol[layout['p11']]},w],[w,w,w]]"
              )
              normalize = lambda value: re.sub(r"\s+", "", value)
              if normalize(match.group(1)) != normalize(expected):
                  raise SystemExit(f"{candidate_id}: core assignment/reflector positions do not match the declared layout")
              subprocess.run([sys.executable, str(builder)], cwd=builder.parent, check=True)
              xml_files = []
              for name in ("materials.xml", "geometry.xml", "settings.xml", "plots.xml", "tallies.xml"):
                  path = builder.parent / name
                  if not path.is_file():
                      raise SystemExit(f"{candidate_id}: missing generated {name}")
                  ET.parse(path)
                  data = path.read_bytes()
                  xml_files.append({"file": name, "size_bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              settings = ET.parse(builder.parent / "settings.xml").getroot()
              settings_values = {tag: settings.findtext(tag) for tag in ("run_mode", "energy_mode", "batches", "inactive", "particles", "seed")}
              audits.append({
                  "candidate_id": candidate_id,
                  "layout": layout,
                  "canonical_reference": case["is_canonical_reference_arrangement"],
                  "core_assignment_verified": True,
                  "fixed_reflector_positions_verified": True,
                  "generated_xml_count": len(xml_files),
                  "xml_files": xml_files,
                  "settings": settings_values,
                  "mgxs_file_present": (builder.parent / "mgxs.h5").is_file(),
                  "transport_run_performed": False
              })
          result = {
              "schema_version": "1.0",
              "status": "xml_inputs_generated_and_well_formed",
              "upstream_commit": summary["upstream_commit"],
              "candidate_count": len(audits),
              "all_core_assignments_verified": all(item["core_assignment_verified"] for item in audits),
              "all_xml_well_formed": all(item["generated_xml_count"] == 5 for item in audits),
              "all_mgxs_files_present": all(item["mgxs_file_present"] for item in audits),
              "transport_run_performed": False,
              "cases": audits,
              "limitations": [
                  "XML generation and syntax checks do not prove that a transport run can execute.",
                  "MGXS/cross-section data are not bundled in the prepared-case artifact; no OpenMC transport run was launched.",
                  "Candidate layouts are not all official benchmark reference cases."
              ]
          }
          out = root / "XML_INPUT_AUDIT.json"
          out.write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps({
              "status": result["status"],
              "candidate_count": result["candidate_count"],
              "all_core_assignments_verified": result["all_core_assignments_verified"],
              "all_xml_well_formed": result["all_xml_well_formed"],
              "all_mgxs_files_present": result["all_mgxs_files_present"],
              "transport_run_performed": False
          }, indent=2))
          if not result["all_core_assignments_verified"] or not result["all_xml_well_formed"]:
              raise SystemExit("candidate XML audit failed")
          PY

      - name: Run six low-budget transport smoke tests (not benchmark-grade)
        shell: bash -el {0}
        run: |
          python scripts/run_c5g7_layout_study.py \
            --source-root /tmp/mit-crpg-benchmarks \
            --design-space config/benchmarks/c5g7_2x2_design_space.json \
            --output /tmp/c5g7-layout-study-smoke-run \
            --mode run \
            --batches 100 \
            --inactive 10 \
            --particles 1000 \
            --threads 1 \
            --seed-base 620000

      - name: Analyze smoke-run uncertainty and cross-section provenance
        shell: bash -el {0}
        run: |
          python -m pip install matplotlib
          python scripts/analyze_c5g7_smoke_results.py \
            --study-summary /tmp/c5g7-layout-study-smoke-run/STUDY_SUMMARY.json \
            --outdir /tmp/c5g7-layout-study-smoke-run/analysis

      - name: Cross-check all six raw HDF5 smoke statepoints
        shell: bash -el {0}
        run: |
          python scripts/audit_c5g7_smoke_statepoints.py \
            --study-summary /tmp/c5g7-layout-study-smoke-run/STUDY_SUMMARY.json \
            --out /tmp/c5g7-layout-study-smoke-run/analysis/raw_hdf5_audit.json
          cat /tmp/c5g7-layout-study-smoke-run/analysis/raw_hdf5_audit.json

      - name: Preserve prepared inputs and smoke-run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5g7-layout-study-prepared-and-smoke
          path: |
            /tmp/c5g7-design-space-generated.json
            config/benchmarks/c5g7_2x2_design_space.json
            /tmp/c5g7-layout-study-prepared/
            /tmp/c5g7-layout-study-smoke-run/
            /tmp/mit-crpg-benchmarks/UPSTREAM_PROVENANCE.json
          if-no-files-found: error

name: Cancel stale C5G7 run and restart with repaired workflow

on:
  # One-shot control action: adding this file on the experiment branch starts it.
  # Do not edit this file while a campaign is running.
  push:
    branches:
      - experiment/c5g7-physical-effectiveness-20261018
    paths:
      - .github/workflows/c5g7-p45-cancel-and-restart.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-and-dispatch-fixed-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Cancel stale source and waiting re-audit runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cancel_run() {
            local id="$1"
            local code
            code="$(curl --silent --show-error -o "/tmp/cancel-$id.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel")"
            case "$code" in
              202) echo "Cancellation requested for run $id." ;;
              409|422) echo "Run $id was already completed or could not be cancelled (HTTP $code); checking state." ;;
              *) cat "/tmp/cancel-$id.json"; echo "Unexpected cancel response HTTP $code for run $id." >&2; exit 1 ;;
            esac
          }
          cancel_run 39096389643
          cancel_run 39097575056

      - name: Wait until both stale runs stop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wait_for_run() {
            local id="$1"
            local expected_min_jobs="$2"
            for attempt in $(seq 1 120); do
              local run_json jobs_json status count unfinished
              run_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id")"
              status="$(jq -r '.status // "unknown"' <<< "$run_json")"
              jobs_json="$(curl --fail --silent --show-error \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100")"
              count="$(jq '.jobs | length' <<< "$jobs_json")"
              unfinished="$(jq '[.jobs[] | select(.status != "completed")] | length' <<< "$jobs_json")"
              echo "Run $id: status=$status jobs=$count unfinished=$unfinished"
              if [[ "$status" == "completed" && "$unfinished" == "0" && "$count" -ge "$expected_min_jobs" ]]; then
                return 0
              fi
              sleep 15
            done
            echo "Timed out waiting for stale run $id to stop; refusing to dispatch a competing campaign." >&2
            return 1
          }
          wait_for_run 39096389643 36
          wait_for_run 39097575056 1

      - name: Dispatch repaired P-4/P-5/P-6 campaign
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg ref "experiment/c5g7-physical-effectiveness-20261018" '{ref:$ref}')"
          code="$(curl --silent --show-error -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/c5g7-p45-physical-effectiveness.yml/dispatches")"
          if [[ "$code" != "204" ]]; then
            cat /tmp/dispatch-response.json
            echo "The repaired campaign was not dispatched (HTTP $code)." >&2
            exit 1
          fi
          echo "Dispatched a fresh campaign on experiment/c5g7-physical-effectiveness-20261018 using the repaired workflow revision."

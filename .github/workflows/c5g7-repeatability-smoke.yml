name: C5G7 repeated-seed smoke reliability audit

on:
  push:
    paths:
      - ".github/workflows/c5g7-repeatability-smoke.yml"
      - "scripts/analyze_c5g7_repeatability.py"
      - "scripts/run_c5g7_layout_study.py"
      - "scripts/audit_c5g7_smoke_statepoints.py"
      - "scripts/prepare_c5g7_reference.py"
      - "config/benchmarks/c5g7_2x2_design_space.json"
  pull_request:
    paths:
      - ".github/workflows/c5g7-repeatability-smoke.yml"
      - "scripts/analyze_c5g7_repeatability.py"
      - "scripts/run_c5g7_layout_study.py"
      - "scripts/audit_c5g7_smoke_statepoints.py"
      - "scripts/prepare_c5g7_reference.py"
      - "config/benchmarks/c5g7_2x2_design_space.json"
  workflow_dispatch:

concurrency:
  group: c5g7-repeatability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeated-smoke-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenMC 0.16.0
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: c5g7-repeatability
          create-args: >-
            python=3.12
            openmc=0.16.0
          cache-environment: true
      - name: Stage and verify pinned upstream C5G7 source
        shell: bash -el {0}
        run: |
          python scripts/prepare_c5g7_reference.py --destination /tmp/mit-crpg-benchmarks
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("config/benchmarks/c5g7_2x2_design_space.json").read_text())
          actual = json.loads(Path("/tmp/mit-crpg-benchmarks/UPSTREAM_PROVENANCE.json").read_text())
          if actual["source_commit"] != expected["source_model"]["expected_upstream_commit"]:
              raise SystemExit("upstream source commit changed; review the pin before running")
          print("Pinned upstream commit verified:", actual["source_commit"])
          PY
      - name: Run three independent smoke rounds for all six layouts
        shell: bash -el {0}
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5g7-repeatability
          for seed_base in 620000 630000 640000; do
            python scripts/run_c5g7_layout_study.py \
              --source-root /tmp/mit-crpg-benchmarks \
              --design-space config/benchmarks/c5g7_2x2_design_space.json \
              --output "/tmp/c5g7-repeatability/round_${seed_base}" \
              --mode run --batches 100 --inactive 10 --particles 1000 --threads 1 \
              --seed-base "${seed_base}"
            python scripts/audit_c5g7_smoke_statepoints.py \
              --study-summary "/tmp/c5g7-repeatability/round_${seed_base}/STUDY_SUMMARY.json" \
              --out "/tmp/c5g7-repeatability/round_${seed_base}/analysis/raw_hdf5_audit.json"
          done
      - name: Analyze repeated-run variability and rank stability
        shell: bash -el {0}
        run: |
          python scripts/analyze_c5g7_repeatability.py \
            --study-root /tmp/c5g7-repeatability \
            --outdir /tmp/c5g7-repeatability/analysis
          cat /tmp/c5g7-repeatability/analysis/REPEATABILITY_ANALYSIS.md
          cat /tmp/c5g7-repeatability/analysis/repeatability_analysis.json
      - name: Preserve all repeated-run statepoints and analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5g7-layout-repeatability-smoke
          path: /tmp/c5g7-repeatability/
          if-no-files-found: error

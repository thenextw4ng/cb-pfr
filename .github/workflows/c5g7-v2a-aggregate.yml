name: C5G7 V2a final data audit and selection summary

on:
  workflow_run:
    workflows:
      - C5G7 night campaign production runs
      - C5G7 V2a physical-candidate data shard 0
      - C5G7 V2a physical-candidate data shard 1
      - C5G7 V2a physical-candidate data shard 2
      - C5G7 V2a physical-candidate data shard 3
      - C5G7 V2a physical-candidate data shard 4
    types: [completed]
    branches:
      - research/c5g7-b0-prereg-b1-pilot-20261015
  workflow_dispatch:
    inputs:
      campaign_sha:
        description: "Commit SHA of the existing campaign to audit; leave blank when triggered by a campaign run"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  aggregate-when-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout campaign analyzers
        uses: actions/checkout@v4
        with:
          ref: research/c5g7-b0-prereg-b1-pilot-20261015
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find all five V2a shards and production run for this commit
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_SHA: ${{ github.event.inputs.campaign_sha || github.event.workflow_run.head_sha || github.sha }}
          CAMPAIGN_BRANCH: research/c5g7-b0-prereg-b1-pilot-20261015
        run: |
          set -euo pipefail
          mkdir -p /tmp/v2a-artifacts /tmp/production-artifacts /tmp/v2a-summary
          ALL_READY=true
          RID_PROD=""
          for FILE in c5g7-main-production-runs.yml c5g7-v2a-shard-0.yml c5g7-v2a-shard-1.yml c5g7-v2a-shard-2.yml c5g7-v2a-shard-3.yml c5g7-v2a-shard-4.yml; do
            JSON="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$FILE/runs?branch=$CAMPAIGN_BRANCH&per_page=100")"
            MATCH="$(printf '%s' "$JSON" | jq -r --arg SHA "$EXPECTED_SHA" '.workflow_runs | map(select(.head_sha==$SHA)) | sort_by(.created_at) | last // empty | [.id,.status,.conclusion] | @tsv')"
            if [ -z "$MATCH" ]; then
              echo "$FILE has no run for commit $EXPECTED_SHA yet"
              ALL_READY=false
              continue
            fi
            IFS=$'\t' read -r RID STATUS CONCLUSION <<< "$MATCH"
            echo "$FILE id=$RID status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" != "completed" ]; then
              ALL_READY=false
              continue
            fi
            if [ "$FILE" = "c5g7-main-production-runs.yml" ]; then
              RID_PROD="$RID"
              gh run download "$RID" --repo "$GITHUB_REPOSITORY" --dir /tmp/production-artifacts
            else
              SHARD="$(printf '%s' "$FILE" | sed 's/^c5g7-v2a-shard-//; s/\.yml$//')"
              gh run download "$RID" --repo "$GITHUB_REPOSITORY" --dir "/tmp/v2a-artifacts/shard-$SHARD"
            fi
          done
          echo "all_ready=$ALL_READY" >> "$GITHUB_OUTPUT"
          echo "production_run_id=$RID_PROD" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Write pending status when any workload is still queued or running
        if: steps.discover.outputs.all_ready != 'true'
        run: |
          mkdir -p /tmp/v2a-summary
          cat > /tmp/v2a-summary/v2a_pending.json <<'JSON'
          {
            "status": "V2A_PENDING",
            "reason": "One or more of the 75 production jobs or five V2a shards has not completed yet. This is a resource-discovery/poll result, not a data-analysis failure.",
            "official_benchmark_acceptance": false
          }
          JSON
      - name: Audit P1-P6 and V1a production evidence against the seed ledger
        if: steps.discover.outputs.all_ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SEED_LEDGER="$(find /tmp/production-artifacts -type f -name campaign_plan.json -print -quit)"
          if [ -z "$SEED_LEDGER" ]; then
            echo "Required campaign_plan.json seed ledger is missing; production aggregation cannot pass."
            exit 1
          fi
          python scripts/analyze_c5g7_night_campaign.py \
            --artifacts-root /tmp/production-artifacts \
            --seed-ledger "$SEED_LEDGER" \
            --outdir /tmp/v2a-summary/production \
            --expected-main-runs 75
      - name: Audit all 1,200 V2a observations and 60 high-budget references against the seed ledger
        if: steps.discover.outputs.all_ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          SEED_LEDGER="$(find /tmp/production-artifacts -type f -name campaign_plan.json -print -quit)"
          if [ -z "$SEED_LEDGER" ]; then
            echo "Required campaign_plan.json seed ledger is missing; V2a aggregation cannot pass."
            exit 1
          fi
          python scripts/analyze_c5g7_v2a_selection.py \
            --v2a-root /tmp/v2a-artifacts \
            --production-root /tmp/production-artifacts \
            --seed-ledger "$SEED_LEDGER" \
            --outdir /tmp/v2a-summary/v2a
      - name: Review per-run eigenvalue and entropy convergence diagnostics
        if: steps.discover.outputs.all_ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/analyze_c5g7_convergence_study.py \
            --production-root /tmp/production-artifacts \
            --v2a-root /tmp/v2a-artifacts \
            --thresholds-json config/benchmarks/c5g7_convergence_screen_v1.json \
            --outdir /tmp/v2a-summary/convergence
      - name: Compare equal-budget candidate-selection policies
        if: steps.discover.outputs.all_ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/v2a-summary/v2a/v2a_run_level.csv ] && [ -f /tmp/v2a-summary/v2a/v2a_high_budget_reference.csv ] && [ -f /tmp/v2a-summary/v2a/v2a_selection_summary.json ]; then
            python scripts/run_equal_budget_c5g7_selection.py \
              --v2a-csv /tmp/v2a-summary/v2a/v2a_run_level.csv \
              --high-budget-csv /tmp/v2a-summary/v2a/v2a_high_budget_reference.csv \
              --outdir /tmp/v2a-summary/selection-policy
          else
            mkdir -p /tmp/v2a-summary/selection-policy
            printf '%s\n' '{"status":"PENDING_INTEGRITY_GATES","new_openmc_runs":0,"reason":"The 1,200 V2a observations and/or 60 high-budget references are not yet available or failed integrity analysis."}' > /tmp/v2a-summary/selection-policy/equal_budget_policy_report.json
          fi
      - name: Write a combined closeout decision without implying convergence or benchmark acceptance
        if: steps.discover.outputs.all_ready == 'true' && always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("/tmp/v2a-summary")
          prod_p=root/"production/night_campaign_summary.json"
          v2a_p=root/"v2a/v2a_selection_summary.json"
          conv_p=root/"convergence/convergence_study_summary.json"
          policy_p=root/"selection-policy/equal_budget_policy_report.json"
          prod=json.loads(prod_p.read_text()) if prod_p.is_file() else {}
          v2a=json.loads(v2a_p.read_text()) if v2a_p.is_file() else {}
          conv=json.loads(conv_p.read_text()) if conv_p.is_file() else {}
          policy=json.loads(policy_p.read_text()) if policy_p.is_file() else {}
          p_ok=prod.get("integrity_pass") is True and prod.get("observed_run_count")==75
          v_ok=v2a.get("integrity_pass") is True and v2a.get("observed_v2a_runs")==1200 and v2a.get("high_budget_empirical_reference_by_layout") is not None
          report={
            "schema_version":"1.0",
            "campaign_sha":${{ toJSON(steps.discover.outputs.expected_sha) }},
            "status":"ALL_DATA_INTEGRITY_PASS_PENDING_SCIENTIFIC_REVIEW" if p_ok and v_ok else "CAMPAIGN_INCOMPLETE_OR_INTEGRITY_FAIL",
            "production_integrity_pass":p_ok,
            "production_observed_runs":prod.get("observed_run_count"),
            "production_expected_runs":75,
            "v2a_integrity_pass":v_ok,
            "v2a_observed_runs":v2a.get("observed_v2a_runs"),
            "v2a_expected_runs":1200,
            "convergence_certified":False,
            "official_benchmark_acceptance":False,
            "physical_best_layout_claim":False,
            "production_report":"production/night_campaign_summary.json" if prod_p.is_file() else None,
            "v2a_report":"v2a/v2a_selection_summary.json" if v2a_p.is_file() else None,
            "convergence_screen_status":conv.get("status","NOT_RUN"),
            "convergence_screen_pass_count":conv.get("screen_pass"),
            "convergence_screen_fail_count":conv.get("screen_fail"),
            "convergence_review_required_count":conv.get("review_required"),
            "convergence_report":"convergence/convergence_study_summary.json" if conv_p.is_file() else None,
            "equal_budget_selection_status":policy.get("status","NOT_RUN"),
            "equal_budget_selection_report":"selection-policy/equal_budget_policy_report.json" if policy_p.is_file() else None
          }
          root.mkdir(parents=True,exist_ok=True)
          (root/"campaign_closeout.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2))
          if not (p_ok and v_ok):
            raise SystemExit("Campaign closeout remains blocked: one or more integrity/completeness gates did not pass.")
          PY
      - name: Preserve current aggregation status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c5g7-night-v2a-final-audit-${{ github.run_id }}
          path: /tmp/v2a-summary/
          if-no-files-found: warn
          retention-days: 30

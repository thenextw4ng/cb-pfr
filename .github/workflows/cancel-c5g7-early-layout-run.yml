name: Cancel superseded C5G7 pilot duplicates

on:
  push:
    paths:
      - .github/workflows/cancel-c5g7-early-layout-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-superseded-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only superseded B1 attempts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          for RUN_ID in 38735056737 38735162993; do
            CURRENT_STATUS="$(gh api "repos/thenextw4ng/cb-pfr/actions/runs/$RUN_ID" --jq '.status' 2>/dev/null)"
            echo "run=$RUN_ID status_before=$CURRENT_STATUS"
            if [ "$CURRENT_STATUS" = "queued" ] || [ "$CURRENT_STATUS" = "in_progress" ] || [ "$CURRENT_STATUS" = "requested" ]; then
              gh api --method POST "repos/thenextw4ng/cb-pfr/actions/runs/$RUN_ID/cancel" -H "Accept: application/vnd.github+json"
              sleep 2
              NEXT_STATUS="$(gh api "repos/thenextw4ng/cb-pfr/actions/runs/$RUN_ID" --jq '.status' 2>/dev/null)"
              echo "run=$RUN_ID status_after=$NEXT_STATUS"
            fi
          done

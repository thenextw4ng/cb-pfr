name: Cancel C5G7 layout runs that were started before the B0/B1/B2 gates

on:
  push:
    paths:
      - .github/workflows/cancel-c5g7-early-layout-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel-premature-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel premature high-budget and duplicate early B1 runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for RUN_ID in 38729573477 38735056737 38735162993; do
            gh api --method POST "repos/thenextw4ng/cb-pfr/actions/runs/$RUN_ID/cancel" -H "Accept: application/vnd.github+json" || true
          done
          echo "Requested cancellation of the premature six-layout matrix and early duplicate B1 runs. Latest B1 run 38735301955 is authoritative."

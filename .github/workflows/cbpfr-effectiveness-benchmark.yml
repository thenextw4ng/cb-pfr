name: CB-PFR fixed-budget effectiveness benchmark

on:
  push:
    branches:
      - research/cbpfr-effectiveness-benchmark-20261015
    paths:
      - config/benchmarks/cbpfr_effectiveness_protocol_2026-10-15.json
      - scripts/run_cbpfr_effectiveness_benchmark.py
      - .github/workflows/cbpfr-effectiveness-benchmark.yml

permissions:
  contents: read

jobs:
  fixed-budget-synthetic-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out frozen protocol and runner
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m py_compile src/cbpfr/*.py scripts/run_cbpfr_effectiveness_benchmark.py
      - name: Execute development, confirmatory, and stress pools
        run: python scripts/run_cbpfr_effectiveness_benchmark.py --outdir /tmp/cbpfr-effectiveness
      - name: Audit run completeness and paired budget integrity
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path("/tmp/cbpfr-effectiveness")
          report = json.loads((root / "summary.json").read_text())
          assert report["run_status"] == "COMPLETED_INTEGRITY_CHECKS_PENDING_EXTERNAL_REVIEW", report
          assert report["development_pools"] == 200, report
          assert report["candidate_pool_size"] == 12, report
          assert report["confirmatory_pool_count"] == 6000, report
          assert report["confirmatory_selection_rows"] == 24000, report
          assert report["candidate_observation_rows"] == 74400, report
          assert report["evaluator_truth_rows"] == 74400, report
          assert report["same_pool_and_observations_for_all_methods"] is True, report
          assert report["equal_fixed_budget_asserted"] is True, report
          assert report["truth_table_kept_separate_until_after_selection"] is True, report
          with (root / "pool_method_selections.csv").open(newline="") as f:
              selections = list(csv.DictReader(f))
          assert len(selections) == 24000, len(selections)
          groups = {}
          for row in selections:
              key = (row["pool_id"], row["regime"])
              groups.setdefault(key, []).append(row)
          assert len(groups) == 6000, len(groups)
          for key, rows in groups.items():
              assert {r["method"] for r in rows} == {"qubo_only", "point_estimate", "cb_pfr", "uniform_margin"}, key
              assert {int(r["physical_evaluation_budget"]) for r in rows} == {12}, key
          with (root / "paired_effects.csv").open(newline="") as f:
              effects = list(csv.DictReader(f))
          assert len(effects) == 12, len(effects)
          assert all(int(row["pools"]) == 1000 for row in effects), effects
          with (root / "method_summary.csv").open(newline="") as f:
              summaries = list(csv.DictReader(f))
          assert len(summaries) == 24, len(summaries)
          assert all(int(row["pools"]) == 1000 for row in summaries), summaries
          print("Integrity audit passed. Scientific superiority decision:", report["scientific_decision"])
          print("No CI assertion requires superiority: a negative result must remain publishable.")
          PY
      - name: Preserve full reproducible benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CBPFR-fixed-budget-effectiveness-2026-10-15
          path: /tmp/cbpfr-effectiveness/
          if-no-files-found: error
          retention-days: 30

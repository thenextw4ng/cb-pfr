name: Dashboard smoke tests

on:
  push:
    branches:
      - ui/cbpfr-scientific-workstation
  pull_request:
    branches:
      - ui/cbpfr-scientific-workstation
  workflow_dispatch:

jobs:
  dashboard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "streamlit>=1.36,<2" "pandas>=2,<3" "plotly>=5.22,<7" pytest
      - name: Compile Python sources
        run: python -m compileall -q app.py pages src tests
      - name: Run dashboard smoke tests
        run: pytest -q tests/test_dashboard_smoke.py

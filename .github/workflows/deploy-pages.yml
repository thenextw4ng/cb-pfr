name: Deploy CB-PFR Scientific Workstation

on:
  push:
    branches:
      - "ui/institutional-branding-20261016"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cb-pfr-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt

      - name: Install read-only evidence dependencies
        run: python -m pip install -r requirements-web.txt

      - name: Build static dashboard and recorded API snapshots
        run: python scripts/build_static_pages.py

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Publish public website
        id: deployment
        uses: actions/deploy-pages@v4

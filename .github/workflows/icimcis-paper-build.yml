name: Build anonymous ICIMCIS manuscript
on:
  push:
    branches:
      - paper/icimcis-high-compute-revision-2026-10-15
    paths:
      - paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.tex
      - paper/submission/references.bib
      - paper/submission/canonical_high_budget_summary.csv
      - paper/submission/c5g7_entropy_mesh_recheck_2026-10-15.csv
      - paper/submission/REVISION_AUDIT.md
      - paper/submission/analyze_symmetry_screen.py
      - scripts/analyze_c5g7_canonical_convergence.py
      - paper/submission/analyze_mirror_pairs.py
      - tests/test_cbpfr_formal_properties.py
      - src/cbpfr/ranking.py
      - src/cbpfr/integration.py
      - .github/workflows/icimcis-paper-build.yml
concurrency:
  group: icimcis-manuscript-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript branch
        uses: actions/checkout@v4
        with:
          ref: paper/icimcis-high-compute-revision-2026-10-15
          persist-credentials: true
      - name: Recompute symmetry-class screen from archived run-level CSV
        shell: bash
        run: |
          python3 paper/submission/analyze_symmetry_screen.py \
            --input results/cbpfr_physical_feasibility_bridge_2026-10-12.csv \
            --output /tmp/cbpfr-symmetry-screen.json --sweep
          python3 - <<'PY'
          import json
          with open("/tmp/cbpfr-symmetry-screen.json", encoding="utf-8") as handle:
              report = json.load(handle)
          classes = {row["class"]: row for row in report["class_summary"]}
          assert len(classes) == 4
          assert round(classes["S1"]["mean_F"], 6) == 1.295867
          assert round(classes["S2"]["mean_F"], 6) == 1.316149
          assert report["screen"]["passing_classes"] == 2
          assert report["screen"]["passing_layout_labels"] == 3
          sweep = {row["F_max"]: row for row in report["retrospective_sensitivity_sweep"]}
          assert sweep[1.87]["z_0"]["passing_layout_labels"] == 6
          assert sweep[1.87]["z_1"]["passing_layout_labels"] == 6
          assert sweep[1.87]["z_2"]["passing_layout_labels"] == 5
          assert sweep[1.87]["z_2"]["passing_symmetry_classes"] == 3
          print("Class table and retrospective sensitivity reproduce the manuscript's key counts.")
          PY
      - name: Recompute two-protocol UMMU audit and descriptive uncertainty scores
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, math, statistics
          from collections import defaultdict
          path = "paper/submission/canonical_high_budget_summary.csv"
          groups = defaultdict(list)
          with open(path, newline="", encoding="utf-8") as handle:
              for row in csv.DictReader(handle):
                  groups[row["protocol"]].append(row)
          assert set(groups) == {"A_500_inactive", "B_100_inactive"}
          assert all(len(rows) == 3 for rows in groups.values())
          expected_inactive = {"A_500_inactive": "500", "B_100_inactive": "100"}
          ref, uref = 1.18655, 0.000095
          for name, rows in groups.items():
              assert {r["seed"] for r in rows} == {"720000", "730000", "740000"}
              assert len({r["statepoint_sha256"] for r in rows}) == 3
              assert {r["inactive_batches"] for r in rows} == {expected_inactive[name]}
              assert {r["raw_hdf5_audit"] for r in rows} == {"PASS"}
              assert {r["mgxs_group_structure_audit"] for r in rows} == {"PASS"}
              assert len({r["mgxs_sha256"] for r in rows}) == 1
              means = [float(r["keff_mean"]) for r in rows]
              sds = [float(r["keff_std_dev"]) for r in rows]
              mean = statistics.mean(means)
              between = statistics.stdev(means)
              within = math.sqrt(sum(x*x for x in sds) / len(sds))
              run_se = max(between / math.sqrt(len(rows)), within / math.sqrt(len(rows)))
              combined = math.sqrt(uref*uref + run_se*run_se)
              z = (mean-ref) / combined
              ratio = between / within
              print(f"{name}: mean={mean:.11f}; between/within SD={ratio:.4f}; z={z:.4f}")
              if name == "A_500_inactive":
                  assert round(mean, 8) == 1.18649321
                  assert round((mean-ref)*1e5, 2) == -5.68
                  assert round(z, 3) == -0.434
              else:
                  assert round(mean, 8) == 1.18647358
                  assert round((mean-ref)*1e5, 2) == -7.64
                  assert round(z, 3) == -0.698
                  assert ratio < 0.1
                  assert {int(r["entropy_mesh_warning_count"]) for r in rows} == {7000}
          PY
      - name: Test formal properties and compute mirror-label intervals
        shell: bash
        run: |
          python3 -m pip install -e . scipy
          python3 -m unittest discover -s tests -p 'test_cbpfr_formal_properties.py' -v
          python3 paper/submission/analyze_mirror_pairs.py \
            --input results/cbpfr_physical_feasibility_bridge_2026-10-12.csv \
            --output paper/submission/mirror_pair_comparison.csv
          python3 - <<'PY'
          import csv
          p = "paper/submission/mirror_pair_comparison.csv"
          with open(p, newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 4, rows
          assert all(r["equivalence_margin_prespecified"] == "False" for r in rows)
          assert all(r["equivalence_conclusion"] == "NOT_TESTED_MARGIN_NOT_PRESPECIFIED" for r in rows)
          print("Four descriptive mirror-label intervals reproduced; no equivalence claim is emitted.")
          PY
      - name: Test the portable anonymous supplement
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=paper/submission/supplementary python3 -m unittest discover \
            -s paper/submission/supplementary/tests -v

      - name: Compile IEEE conference PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper/submission
          root_file: CBPFR_ICIMCIS_2026_Anonymous_Review.tex
          args: -pdf -file-line-error -interaction=nonstopmode -halt-on-error
      - name: Check PDF length, text, and anonymity
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils zip
          pdfinfo paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.pdf | tee /tmp/pdfinfo.txt
          PAGES=$(awk '/^Pages:/ {print $2}' /tmp/pdfinfo.txt)
          test -n "$PAGES" && test "$PAGES" -le 6
          pdftotext -layout paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.pdf /tmp/manuscript.txt
          grep -q "1.18649321" /tmp/manuscript.txt
          grep -q "5.68" /tmp/manuscript.txt
          grep -q "15.57" /tmp/manuscript.txt
          grep -q "1.18647358" /tmp/manuscript.txt
          grep -q "7.64" /tmp/manuscript.txt
          grep -q "0.698" /tmp/manuscript.txt
          ! grep -Eiq "missing from the earlier paper draft|review-required|this distinction resolves an important interpretive point|corrected-group|saved scalar reference|saved project screen|high-compute|NUMERICAL_SCREEN_PASS_FULL_BENCHMARK_STILL_BLOCKED|This is a useful warning" /tmp/manuscript.txt
          ! grep -Eiq "Fachry Bagus Adiputra|Nicholas Ardi Tirta|gambaranfachry03@gmail.com|nicholas.ardi@santa-laurensia.sch.id" /tmp/manuscript.txt
          ! grep -Eiq "^[[:space:]]*Page[[:space:]]+[0-9]+" /tmp/manuscript.txt
          echo "PDF checks passed: pages=$PAGES"
      - name: Assemble review submission package
        shell: bash
        run: |
          rm -rf /tmp/cbpfr-review-package
          find paper/submission/supplementary -type d -name __pycache__ -prune -exec rm -rf {} +
          find paper/submission/supplementary -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          mkdir -p /tmp/cbpfr-review-package/supplementary/scripts /tmp/cbpfr-review-package/supplementary/data /tmp/cbpfr-review-package/supplementary/tests /tmp/cbpfr-review-package/supplementary/cbpfr
          cp paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.pdf /tmp/cbpfr-review-package/
          cp paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.tex paper/submission/references.bib /tmp/cbpfr-review-package/
          cp paper/submission/canonical_high_budget_summary.csv /tmp/cbpfr-review-package/supplementary/data/ummu_run_level_protocol_audit.csv
          cp paper/submission/c5g7_entropy_mesh_recheck_2026-10-15.csv /tmp/cbpfr-review-package/supplementary/data/corrected_mesh_recheck_run_level.csv
          cp results/cbpfr_physical_feasibility_bridge_2026-10-12.csv /tmp/cbpfr-review-package/supplementary/data/six_layout_run_level_results.csv
          cp -R paper/submission/supplementary/cbpfr/. /tmp/cbpfr-review-package/supplementary/cbpfr/
          cp paper/submission/supplementary/tests/test_formal_properties.py /tmp/cbpfr-review-package/supplementary/tests/
          cp src/cbpfr/ranking.py src/cbpfr/integration.py /tmp/cbpfr-review-package/supplementary/scripts/
          cp paper/submission/analyze_symmetry_screen.py paper/submission/analyze_mirror_pairs.py /tmp/cbpfr-review-package/supplementary/scripts/
          cp paper/submission/mirror_pair_comparison.csv /tmp/cbpfr-review-package/supplementary/data/
          cp tests/test_cbpfr_formal_properties.py /tmp/cbpfr-review-package/supplementary/tests/
          cp scripts/run_c5g7_cbpfr_physical_selection.py scripts/analyze_c5g7_canonical_convergence.py scripts/audit_c5g7_source_convergence.py /tmp/cbpfr-review-package/supplementary/scripts/
          cat > /tmp/cbpfr-review-package/REPRODUCIBILITY_NOTES.md <<'EOF'
          # Reproducibility notes

          This anonymous supplement accompanies an exploratory computational case study of an auditable decision-support workflow for screening QUBO-feasible fuel-layout labels with OpenMC-derived evidence.

          ## Contents
          - `supplementary/data/six_layout_run_level_results.csv`: archived 18-run, six-layout data table.
          - `supplementary/data/ummu_run_level_protocol_audit.csv`: six archived UMMU run records for two separate inactive-batch protocols.
          - `supplementary/data/corrected_mesh_recheck_run_level.csv`: statepoint-derived diagnostics from six corrected-mesh reruns of the same seed/protocol cells; zero source-outside-mesh warnings, but convergence is not certified.
          - `supplementary/data/mirror_pair_comparison.csv`: descriptive Welch intervals for the two mirror-label pairs.
          - `supplementary/cbpfr/`: portable QUBO and CB-PFR ranking implementation used by the formal-property tests.
          - `supplementary/tests/`: software-property regression tests.
          - `supplementary/scripts/`: analysis and diagnostic scripts.

          ## Re-run software-property tests
          From the extracted package root, run:
          `PYTHONPATH=supplementary python -m unittest discover -s supplementary/tests -v`

          These tests cover uncertainty-violation monotonicity, permutation-invariant substantive ranks and tie groups, fail-closed handling of missing or invalid evidence, and the zero-multiplier point-estimate limit. They test software behavior only.

          ## Evidence limits
          The archived thresholds are retrospective illustrative settings, not engineering or safety limits. All six layouts were enumerated; this case study did not run a pre-physics optimizer or annealer and establishes no optimizer superiority or quantum advantage. The original 100-inactive protocol logs emitted entropy-mesh warnings; the corrected-mesh follow-up removed those warnings for all six reruns, but the anomalously low between-run dispersion persisted. The rerun used the same seed/protocol cells and is not an independent replication campaign. Neither archived nor corrected-mesh results certify source convergence, calibrated interval coverage, physical optimum, or full benchmark validation.

          The package deliberately omits internal audit logs and internal project links to preserve double-blind review.
          EOF
          cat > /tmp/cbpfr-review-package/README_SUBMISSION.md <<'EOF'
          Anonymous ICIMCIS 2026 review package
          - PDF: anonymous review manuscript, maximum six pages.
          - TeX/BibTeX: editable source and references.
          - Supplement: 18-run six-layout OpenMC table, six individual UMMU runs from two inactive-batch protocols, CB-PFR ranking/screen code, diagnostic scripts, and four mirror-label Welch intervals with their reproducing script. The corrected-mesh run-level audit CSV is included separately and is not an independent-seed replication.
          - Reproducibility notes: methods, test command, data inventory, and evidence limitations. This reader-facing note excludes internal repository links, branch names, workflow URLs, and author identities.
          - Formal-property unit tests cover uncertainty monotonicity, permutation-invariant ranks/ties, fail-closed evidence handling, and the zero-multiplier point-estimate rule.
          - The portable bundled `supplementary/cbpfr` package includes the QUBO and ranking implementation and is tested before packaging. Re-run it from the extracted ZIP with: `PYTHONPATH=supplementary python -m unittest discover -s supplementary/tests -v`.
          - Mirror intervals are descriptive only; no equivalence margin was specified before data acquisition, so no statistical-equivalence claim is made.
          - The two UMMU protocols have materially different between-run dispersion; the 100-inactive runs contain repeated entropy-mesh warnings. Neither protocol is presented as a validated benchmark estimate.
          - Illustrative acceptance thresholds were selected retrospectively; the sensitivity analysis is exploratory.
          - Model/tally correspondence and source convergence remain unresolved, and the results do not establish full benchmark validation.
          EOF
          cd /tmp/cbpfr-review-package
          zip -qr "$GITHUB_WORKSPACE/CBPFR_ICIMCIS_2026_Review_Submission_Package.zip" .
      - name: Verify tests from the extracted review ZIP
        shell: bash
        run: |
          CHECK_DIR=/tmp/cbpfr-review-package-check
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          unzip -q "$GITHUB_WORKSPACE/CBPFR_ICIMCIS_2026_Review_Submission_Package.zip" -d "$CHECK_DIR"
          if unzip -Z1 "$GITHUB_WORKSPACE/CBPFR_ICIMCIS_2026_Review_Submission_Package.zip" | grep -Eq "(^|/)__pycache__/|\.py[co]$"; then
            echo "Unexpected Python bytecode/cache files found in submission ZIP."
            exit 1
          fi
          if unzip -Z1 "$GITHUB_WORKSPACE/CBPFR_ICIMCIS_2026_Review_Submission_Package.zip" | grep -Eiq 'REVISION_AUDIT|gambaranfachry|nicholas[.]ardi|(^|/)[.]DS_Store$'; then
            echo "An internal-audit, identity-like, or OS metadata filename was found in the submission ZIP."
            exit 1
          fi
          if grep -RInE 'github[.]com/thenextw4ng|paper/icimcis-high-compute-revision|/Users/[^/[:space:]]+|/home/[^/[:space:]]+|Fachry Bagus Adiputra|Nicholas Ardi Tirta|gambaranfachry03@gmail[.]com|nicholas[.]ardi@santa-laurensia[.]sch[.]id' "$CHECK_DIR"; then
            echo "Potential internal repository, absolute path, or author identity leak found in the extracted ZIP."
            exit 1
          fi
          cd "$CHECK_DIR"
          PYTHONPATH=supplementary python3 -m unittest discover -s supplementary/tests -v

      - name: Commit built PDF to manuscript branch
        shell: bash
        run: |
          BRANCH="paper/icimcis-high-compute-revision-2026-10-15"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A build must never commit a PDF if manuscript source changed while compiling.
          git fetch origin "$BRANCH"
          if ! git diff --quiet HEAD "origin/$BRANCH" -- \
            paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.tex \
            paper/submission/references.bib \
            paper/submission/canonical_high_budget_summary.csv \
            scripts/analyze_c5g7_canonical_convergence.py \
            scripts/run_reduced_synthetic_calibration.py \
            paper/submission/analyze_mirror_pairs.py \
            tests/test_cbpfr_formal_properties.py \
            src/cbpfr/ranking.py src/cbpfr/integration.py \
            paper/submission/REVISION_AUDIT.md \
            .github/workflows/icimcis-paper-build.yml; then
            echo "Manuscript source advanced during this build; skipping stale PDF commit."
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git reset --mixed "origin/$BRANCH"
            git add paper/submission/CBPFR_ICIMCIS_2026_Anonymous_Review.pdf
            if git diff --cached --quiet; then
              echo "Current branch already has this PDF."
              exit 0
            fi
            git commit -m "Build anonymous ICIMCIS 2026 review manuscript PDF"
            if git push origin HEAD:"$BRANCH"; then
              exit 0
            fi
            echo "Push race on attempt $attempt; fetching latest branch and retrying."
            sleep 3
          done
          echo "Could not push built PDF after retries."
          exit 1
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: CBPFR-ICIMCIS-2026-Anonymous-Review-Submission
          path: CBPFR_ICIMCIS_2026_Review_Submission_Package.zip
          if-no-files-found: error
          retention-days: 30

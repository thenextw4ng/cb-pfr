name: Exploratory OpenMC distinct-candidate R&S screen
on:
  push:
    branches: [research/openmc-cbpfr-low-cost-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: openmc
          create-args: >-
            python=3.11
            numpy
            openmc
          cache-environment: true
      - name: Verify OpenMC
        shell: bash -el {0}
        run: |
          python -c "import openmc, numpy; print('OpenMC', openmc.__version__)"
          openmc --version
      - name: Run equal-budget candidate screen
        shell: bash -el {0}
        env:
          OPENMC_BATCHES: "12"
          OPENMC_INACTIVE: "4"
          OPENMC_PARTICLES: "300"
          OPENMC_THREADS: "2"
          OPENMC_SEEDS: "20261011,20261012,20261013"
          KEFF_THRESHOLD: "1.0"
          CBPFR_Z: "1.96"
        run: python scripts/run_openmc_distinct_candidate_rs_screen.py
      - name: Upload raw runs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmc-distinct-candidate-rs-screen
          path: results/openmc_distinct_candidates_rs_2026-10-11/
          if-no-files-found: warn

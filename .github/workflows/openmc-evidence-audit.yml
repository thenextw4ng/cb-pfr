name: OpenMC evidence audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit-statepoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMC Python API
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: openmc-audit
          create-args: >-
            python=3.12
            openmc=0.16.0
          cache-environment: true

      - name: Extract and inventory archived statepoints
        shell: bash -el {0}
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile

          archive = Path("OpenMC_HDF5_Evidence_2026-10-11.zip")
          target = Path("/tmp/openmc-hdf5-evidence")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC failure: {bad}")
              for info in zf.infolist():
                  member = PurePosixPath(info.filename)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"unsafe archive member path: {info.filename}")
              zf.extractall(target)
          statepoints = sorted(target.rglob("statepoint*.h5"))
          production = [p for p in statepoints if p.name == "statepoint.20000.h5"]
          if len(production) != 1:
              raise SystemExit(f"expected one production statepoint.20000.h5, found {len(production)}")
          if not statepoints:
              raise SystemExit("no statepoint*.h5 files found in evidence ZIP")
          print(f"statepoint_count={len(statepoints)}")
          for path in statepoints:
              print(f"statepoint={path} size_bytes={path.stat().st_size}")
          PY

      - name: Audit all archived statepoints with OpenMC API
        shell: bash -el {0}
        run: |
          production="$(find /tmp/openmc-hdf5-evidence -name statepoint.20000.h5 -print -quit)"
          test -n "$production"
          python scripts/audit_openmc_statepoint.py --statepoint "$production" --outdir /tmp/openmc-statepoint-audit
          while IFS= read -r statepoint; do
            if [ "$statepoint" = "$production" ]; then
              continue
            fi
            relative="${statepoint#/tmp/openmc-hdf5-evidence/}"
            label="$(printf '%s' "$relative" | tr '/.' '__')"
            python scripts/audit_openmc_statepoint.py \
              --statepoint "$statepoint" \
              --outdir "/tmp/openmc-statepoint-audit/runs/$label"
          done < <(find /tmp/openmc-hdf5-evidence -type f -name 'statepoint*.h5' | sort)
          python scripts/summarize_openmc_run_audits.py \
            --audit-root /tmp/openmc-statepoint-audit \
            --out-csv /tmp/openmc-statepoint-audit/statepoint_runs.csv \
            --out-json /tmp/openmc-statepoint-audit/statepoint_runs.json
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          expected = json.loads(Path("evidence/openmc_local_baseline_2026-10-11/result_summary.json").read_text())
          audit = json.loads(Path("/tmp/openmc-statepoint-audit/statepoint_audit.json").read_text())
          observed = audit.get("keff")
          if not isinstance(observed, dict):
              raise SystemExit(f"OpenMC API did not return scalar keff metadata: {observed!r}")
          mean = observed.get("mean")
          sd = observed.get("std_dev")
          if mean is None or sd is None:
              raise SystemExit(f"OpenMC API did not return mean and standard deviation: {observed!r}")
          checks = {
              "keff_mean": math.isclose(float(mean), float(expected["keff_mean"]), rel_tol=1e-6, abs_tol=1e-12),
              "keff_std_dev": math.isclose(float(sd), float(expected["keff_std_dev"]), rel_tol=1e-6, abs_tol=1e-12),
          }
          print(json.dumps({
              "expected": {"mean": expected["keff_mean"], "std_dev": expected["keff_std_dev"]},
              "observed": {"mean": mean, "std_dev": sd},
              "checks": checks,
              "openmc_version": audit.get("openmc_version"),
              "statepoint_read_success": audit.get("statepoint_read_success"),
              "tally_count": len(audit.get("tallies", [])),
          }, indent=2))
          if not all(checks.values()):
              raise SystemExit("Statepoint keff does not match the transcribed summary within tolerance")
          PY

      - name: Summarize tally distributions and relative uncertainty
        shell: bash -el {0}
        run: |
          python scripts/summarize_openmc_tallies.py \
            --audit-json /tmp/openmc-statepoint-audit/statepoint_audit.json \
            --tally-csv /tmp/openmc-statepoint-audit/tally_values_flat.csv \
            --out /tmp/openmc-statepoint-audit/tally_summary.json

      - name: Install plotting dependency
        shell: bash -el {0}
        run: python -m pip install matplotlib

      - name: Render mesh tally and relative-uncertainty maps
        shell: bash -el {0}
        run: |
          python scripts/plot_openmc_tallies.py \
            --audit-json /tmp/openmc-statepoint-audit/statepoint_audit.json \
            --tally-csv /tmp/openmc-statepoint-audit/tally_values_flat.csv \
            --outdir /tmp/openmc-statepoint-audit/plots

      - name: Inventory archived run inputs and checksums
        shell: bash -el {0}
        run: |
          python scripts/inventory_openmc_runs.py /tmp/openmc-hdf5-evidence \
            --out /tmp/openmc-statepoint-audit/artifact_inventory.json

      - name: Audit settings and log provenance
        shell: bash -el {0}
        run: |
          python scripts/audit_openmc_run_inputs.py \
            --root /tmp/openmc-hdf5-evidence \
            --out /tmp/openmc-statepoint-audit/run_input_audit.json

      - name: Preserve machine-derived audit output
        uses: actions/upload-artifact@v4
        with:
          name: openmc-statepoint-audit
          path: /tmp/openmc-statepoint-audit/
          if-no-files-found: error

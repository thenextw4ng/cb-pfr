name: Stage 6 scientific visual acceptance

on:
  push:
    branches:
      - feat/stage6-visual-acceptance
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out the proposed workstation
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install statepoint reader dependencies
        run: python -m pip install --upgrade pip numpy h5py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Download and verify recorded C5G7 input study
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11719691969/zip" \
            --output "$RUNNER_TEMP/c5g7-study-640000.zip"
          echo "7a5e2a3daf87d0141ddc5e0922b88c4c0e2c3cb91af67ca6a2f50b6535e9862b  $RUNNER_TEMP/c5g7-study-640000.zip" | sha256sum --check

      - name: Check scientific data and visualization contracts
        run: python tests/test_visual_acceptance.py

      - name: Static-check workstation JavaScript
        run: node --check web/app.js && node --check tests/browser_visual_acceptance.cjs

      - name: Start workstation using the archived 2D statepoint
        shell: bash
        run: |
          set -euo pipefail
          export CBPFR_STATEPOINT_ARCHIVE="$RUNNER_TEMP/c5g7-study-640000.zip"
          export CBPFR_STATEPOINT_MEMBER="c5g7-2x2-UMMU/model/2d/statepoint.5000.h5"
          export CBPFR_STATEPOINT_BASELINE="$RUNNER_TEMP/no-authoritative-baseline.json"
          python web_server.py > "$RUNNER_TEMP/cbpfr-web-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cbpfr-web-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/api/health >/dev/null; then
              echo "Workstation API is ready."
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cbpfr-web-server.log"
          exit 1

      - name: Run desktop and mobile Playwright acceptance tests
        run: node tests/browser_visual_acceptance.cjs

      - name: Upload screenshots, JSON result, and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbpfr-stage6-visual-acceptance-${{ github.run_id }}
          path: |
            artifacts/stage6-visual-acceptance/
            ${{ runner.temp }}/cbpfr-web-server.log
          if-no-files-found: warn
          retention-days: 21

name: CB-PFR tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Install dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Compile Python sources
        run: python -m py_compile src/cbpfr/*.py tests/*.py examples/*.py scripts/*.py
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Run examples
        run: |
          python examples/toy_qubo_example.py
          python examples/basic_ranking.py
      - name: Audit C5G7 repeatability against provisional validation gates
        run: |
          python scripts/audit_c5g7_validation_gates.py \
            --runs-csv results/c5g7_repeatability_smoke_2026-10-11/run_level_results.csv \
            --out /tmp/c5g7-validation-gates.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/c5g7-validation-gates.json").read_text())
          assert report["run_count"] == 18, report
          assert report["candidate_count"] == 6, report
          assert all(report["global_checks"][key] for key in (
              "common_compute_settings", "unique_seeds", "unique_statepoint_hashes",
              "single_mgxs_hash", "all_raw_hdf5_audits_pass"
          )), report
          assert report["status"] == "FAIL_OR_INCOMPLETE_CANONICAL_KEFF_SCREEN", report
          assert report["is_official_benchmark_acceptance"] is False, report
          print("Smoke data integrity passed; low-budget canonical scalar screen correctly remains unpassed.")
          PY
      - name: Audit committed evidence archives
        run: |
          python -m pip install h5py
          python - <<'PY'
          import h5py
          import numpy as np
          for path, edge in [("/tmp/mgxs-a.h5", 1e-5), ("/tmp/mgxs-b.h5", 9.999999999999999e-6)]:
              with h5py.File(path, "w") as f:
                  f.attrs["group structure"] = np.array([edge, 1.0, 1.0e7], dtype=float)
                  f.create_dataset("cross_sections", data=np.array([[1.0, 2.0], [3.0, 4.0]], dtype=float))
          PY
          python scripts/fingerprint_hdf5_semantics.py --files /tmp/mgxs-a.h5 /tmp/mgxs-b.h5 --out /tmp/mgxs-semantic-check.json --require-datasets-identical
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/mgxs-semantic-check.json").read_text())
          assert result["dataset_content_equal"] is True, result
          assert result["full_semantic_equal"] is False, result
          assert len(result["comparisons"][0]["attribute_differences"]) == 1, result
          print("HDF5 semantic fingerprint correctly distinguishes dataset equality from metadata differences.")
          PY
          python scripts/audit_evidence_archive.py --archive OpenMC_HDF5_Evidence_2026-10-11.zip --out /tmp/openmc-evidence-archive-audit.json --require-statepoint
          python scripts/audit_evidence_archive.py --archive CBPFR_ReactorQ__Archive_2026-10-11.zip --out /tmp/conversation-archive-audit.json
          cat /tmp/openmc-evidence-archive-audit.json
          cat /tmp/conversation-archive-audit.json
      - name: Cross-check raw production statepoint against recorded summary
        run: |
          python scripts/audit_openmc_hdf5_archive.py \
            --archive OpenMC_HDF5_Evidence_2026-10-11.zip \
            --baseline evidence/openmc_local_baseline_2026-10-11/result_summary.json \
            --out /tmp/openmc-hdf5-semantic-audit.json
          cat /tmp/openmc-hdf5-semantic-audit.json
      - name: Reproduce frozen synthetic benchmark
        run: |
          python scripts/run_reduced_synthetic_calibration.py --results-dir /tmp/cbpfr-reproduced
          python - <<'PY'
          import csv
          expected = {"qubo_only": 0.857, "point_estimate": 0.933, "cb_pfr": 0.976, "uniform_margin": 0.966}
          with open("/tmp/cbpfr-reproduced/main_results.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          actual = {r["method"]: float(r["selected_true_feasibility_rate"]) for r in rows}
          for method, rate in expected.items():
              if abs(actual[method] - rate) > 1e-12:
                  raise SystemExit(f"{method}: expected {rate}, got {actual[method]}")
          print("Frozen synthetic aggregate reproduced exactly:", actual)
          PY

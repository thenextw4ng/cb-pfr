[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-pfr"
version = "0.1.0"
description = "Confidence-Bounded Physical Feasibility Ranking: an uncertainty-aware post-optimization candidate selection layer."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE-CODE.txt"}
authors = [{name = "Fahry Bagus Adiputra"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
